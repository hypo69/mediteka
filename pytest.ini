[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --cov=src --cov=plugins --cov=scripts --cov-report=term-missing --cov-report=html:htmlcov --cov-report=xml:coverage.xml --cov-config=.coveragerc --strict-markers
markers =
    unit: unit tests
    integration: integration tests
    slow: slow running tests
    database: database tests
    api: API endpoint tests