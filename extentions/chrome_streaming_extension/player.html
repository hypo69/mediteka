<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #000;
      font-family: Arial, sans-serif;
    }
    
    #player-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    #video-element {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    #status {
      position: fixed;
      bottom: 20px;
      left: 20px;
      color: white;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 20px;
      border-radius: 5px;
      font-size: 14px;
    }
    
    #status.ready {
      background: rgba(0, 128, 0, 0.7);
    }
    
    #status.playing {
      background: rgba(0, 128, 0, 0.9);
      animation: pulse 2s infinite;
    }
    
    #status.error {
      background: rgba(255, 0, 0, 0.7);
    }
    
    @keyframes pulse {
      0% { opacity: 0.7; }
      50% { opacity: 1; }
      100% { opacity: 0.7; }
    }
  </style>
</head>
<body>
  <div id="player-container">
    <video id="video-element" controls playsinline></video>
  </div>
  
  <div id="status" class="ready">
    Player ready - waiting for stream command
  </div>
  
  <script>
    const video = document.getElementById('video-element');
    const status = document.getElementById('status');
    
    // Сообщаем расширению что плеер готов
    if (chrome && chrome.runtime && chrome.runtime.id) {
      chrome.runtime.sendMessage({
        action: 'playerReady',
        timestamp: Date.now()
      }).catch(err => console.log('Message send error:', err));
    }
    
    // Обработка сообщений от расширения
    chrome.runtime.onMessage.addListener((message, sender, sendResponse) => {
      console.log('Player received:', message);
      
      if (message.action === 'startStream') {
        startStream(message.videoUrl);
        sendResponse({ status: 'started' });
      }
      
      if (message.action === 'getVideoElement') {
        sendResponse({ 
          found: true,
          src: video.src,
          paused: video.paused
        });
      }
    });
    
    function startStream(videoUrl) {
      console.log('Starting stream:', videoUrl);
      
      status.textContent = `Loading: ${videoUrl.substring(0, 50)}...`;
      status.className = '';
      
      // Проверяем, если источник изменился
      if (video.src !== videoUrl) {
        video.src = videoUrl;
        video.load();
      }
      
      video.play()
        .then(() => {
          console.log('Stream started');
          status.textContent = 'Playing...';
          status.className = 'playing';
        })
        .catch(error => {
          console.error('Play error:', error);
          status.textContent = `Error: ${error.message}`;
          status.className = 'error';
        });
    }
    
    // События видеоэлемента
    video.addEventListener('playing', () => {
      status.textContent = 'Playing...';
      status.className = 'playing';
    });
    
    video.addEventListener('waiting', () => {
      status.textContent = 'Buffering...';
      status.className = '';
    });
    
    video.addEventListener('error', (e) => {
      console.error('Video error:', e);
      status.textContent = 'Stream error';
      status.className = 'error';
    });
    
    console.log('Player script loaded');
  </script>
</body>
</html>
