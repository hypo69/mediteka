name: docs-ci

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'src/**'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'src/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install project and docs requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-docs.txt ]; then python -m pip install -e . && python -m pip install -r requirements-docs.txt; else python -m pip install -e . mkdocs mkdocs-material mkdocstrings pymdown-extensions; fi

      - name: Build MkDocs site
        run: |
          mkdocs build --strict
