<!-- Movie Search and Torrent Launcher Tab -->
<div class="row g-3">
  <!-- LEFT: Search and Results -->
  <div class="col-md-8">
    <div class="card mb-3">
      <div class="card-header py-2 d-flex justify-content-between align-items-center">
        <span class="fw-bold" data-i18n="movieSearch.title">🔍 Поиск фильмов на трекерах</span>
      </div>
      <div class="card-body">
        <div class="input-group mb-3">
          <input type="text" class="form-control" id="movie-search-query" 
                 data-i18n-placeholder="movieSearch.placeholder" placeholder="Введите название фильма или сериала (например, Матрица 1080p)...">
          <button class="btn btn-primary" id="btn-movie-search" data-i18n="movieSearch.btnSearch">Найти</button>
        </div>
        
        <!-- Filters & Sorting -->
        <div class="row g-2 mb-3 align-items-center">
          <div class="col-auto">
            <span class="text-muted small" data-i18n="movieSearch.sourceFilter">Фильтр источника:</span>
          </div>
          <div class="col-auto">
            <select class="form-select form-select-sm" id="movie-search-tracker-filter">
              <option value="all" data-i18n="movieSearch.allTrackers">Все трекеры</option>
              <option value="rutracker">Rutracker</option>
              <option value="nnmclub">NNMClub</option>
            </select>
          </div>
          <div class="col-auto ms-auto">
            <span class="text-muted small" data-i18n="movieSearch.sortTitle">Сортировка:</span>
          </div>
          <div class="col-auto">
            <select class="form-select form-select-sm" id="movie-search-sort">
              <option value="seeds" data-i18n="movieSearch.sortSeeds">По сидам (больше)</option>
              <option value="size-desc" data-i18n="movieSearch.sortSizeDesc">По размеру (больше)</option>
              <option value="size-asc" data-i18n="movieSearch.sortSizeAsc">По размеру (меньше)</option>
            </select>
          </div>
        </div>

        <!-- Search Status / Captcha Banner -->
        <div id="movie-search-status" class="alert alert-info d-none">
          <div class="d-flex align-items-center gap-2">
            <div class="spinner-border spinner-border-sm text-info" role="status"></div>
            <span id="movie-search-status-text">Ищем раздачи на Rutracker и NNMClub (это может занять до 15-20 секунд)...</span>
          </div>
        </div>

        <!-- Search Results List -->
        <div id="movie-search-results" class="list-group" style="max-height: calc(100vh - 250px); min-height: 400px; overflow-y: auto;">
          <div class="text-center text-muted p-5 border rounded bg-light" id="movie-search-empty">
            <i class="bi bi-search h1 d-block mb-3 text-secondary"></i>
            <span data-i18n="movieSearch.welcomeText">Введите запрос выше, чтобы начать поиск раздач.</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT: Active Downloads Monitoring -->
  <div class="col-md-4">
    <div class="card h-100">
      <div class="card-header py-2 d-flex justify-content-between align-items-center">
        <span class="fw-bold" data-i18n="movieSearch.activeDownloads">📥 Активные закачки в qBittorrent</span>
        <button class="btn btn-outline-secondary btn-sm py-0 px-2" id="btn-refresh-downloads">🔄</button>
      </div>
      <div class="card-body p-0 d-flex flex-column" style="max-height: calc(100vh - 180px); min-height: 400px; overflow-y: auto;">
        <div id="active-downloads-list" class="list-group list-group-flush">
          <!-- Populated dynamically -->
        </div>
        <div id="active-downloads-empty" class="text-center text-muted p-4" data-i18n="movieSearch.noDownloads">
          Нет активных закачек в данный момент
        </div>
      </div>
    </div>
  </div>
</div>
