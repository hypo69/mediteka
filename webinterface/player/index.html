<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Медиа Плеер</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: system-ui, sans-serif; }
    .player-container { display: flex; flex-direction: column; height: 100vh; }
    .sidebar { width: 350px; background: #1a1a1a; border-right: 1px solid #333; overflow-y: auto; }
    .sidebar-header { padding: 15px; border-bottom: 1px solid #333; }
    .sidebar-header h2 { font-size: 18px; margin-bottom: 10px; }
    .category-tabs { display: flex; flex-wrap: wrap; gap: 5px; }
    .category-btn { padding: 6px 12px; border: none; background: #333; color: #ccc; border-radius: 4px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
    .category-btn:hover { background: #444; }
    .category-btn.active { background: #0d6efd; color: #fff; }
    .file-list { padding: 10px; }
    .file-item { padding: 10px; margin-bottom: 6px; background: #2a2a2a; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
    .file-item:hover { background: #3a3a3a; }
    .file-item.active { background: #0d6efd; }
    .file-name { font-size: 14px; font-weight: 500; }
    .file-meta { font-size: 11px; color: #888; margin-top: 4px; }
    .file-type { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 10px; margin-right: 8px; }
    .file-type.series { background: #6610f2; color: #fff; }
    .file-type.movie { background: #0d6efd; color: #fff; }
    .video-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; }
    video { max-width: 100%; max-height: 100%; }
    .controls { padding: 15px; background: #1a1a1a; display: flex; gap: 10px; align-items: center; border-top: 1px solid #333; }
    .file-info { flex: 1; font-size: 14px; color: #aaa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    .btn-primary { background: #0d6efd; color: #fff; }
    .btn-secondary { background: #6c757d; color: #fff; }
    .btn-sm { padding: 6px 12px; font-size: 13px; }
    .error { color: #f44336; padding: 20px; text-align: center; }
    .no-files { padding: 30px; text-align: center; color: #888; }
    .search-box { margin-bottom: 10px; }
    .search-box input { width: 100%; padding: 8px 12px; border: 1px solid #444; border-radius: 4px; background: #2a2a2a; color: #fff; font-size: 14px; }

    /* Floating Chat styles */
    .video-wrapper { position: relative; }
    .chat-toggle-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(13, 110, 253, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
    }
    .chat-toggle-btn:hover {
      transform: scale(1.1);
      background: #0b5ed7;
      box-shadow: 0 6px 20px rgba(13, 110, 253, 0.5);
    }
    .chat-popup {
      position: absolute;
      bottom: 80px;
      right: 20px;
      width: 80vw;
      max-width: 960px;
      min-width: 320px;
      min-height: 250px;
      height: 400px;
      background: rgba(26, 26, 26, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      z-index: 101;
      opacity: 0;
      transform: translateY(20px) scale(0.95);
      pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.165, 0.84, 0.44, 1), transform 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
      resize: both;
      overflow: hidden;
    }
    .chat-popup.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: all;
    }
    .chat-popup.maximized {
      width: 96vw;
      max-width: 96vw;
      height: 90vh;
      bottom: 2vh;
      left: 2vw;
      right: auto;
    }
    .chat-popup-header {
      padding: 12px 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.2);
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }
    .chat-window-controls {
      display: flex;
      gap: 6px;
    }
    .chat-window-btn {
      background: transparent;
      border: none;
      color: #aaa;
      font-size: 14px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: all 0.2s;
      min-width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chat-window-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    .chat-window-btn.maximize {
      color: #e0c044;
    }
    .chat-window-btn.minimize {
      color: #e0a044;
    }
    .chat-window-btn.close {
      color: #f44336;
    }
    .chat-window-btn.close:hover {
      background: #f44336;
      color: #fff;
    }
    .chat-popup-messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chat-popup-msg {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.4;
      word-break: break-word;
    }
    .chat-popup-msg.bot {
      background: rgba(255, 255, 255, 0.08);
      color: #e0e0e0;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }
    .chat-popup-msg.user {
      background: #0d6efd;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }
    .chat-popup-input-area {
      padding: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      gap: 8px;
      background: rgba(0, 0, 0, 0.1);
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
    }
    .chat-popup-input-area input {
      flex: 1;
      padding: 6px 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .chat-popup-input-area input:focus {
      border-color: #0d6efd;
      background: rgba(255, 255, 255, 0.08);
    }
    .chat-popup-input-area button {
      padding: 6px 12px;
      background: #0d6efd;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .chat-popup-input-area button:hover {
      background: #0b5ed7;
    }
    .chat-popup-input-area button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="player-container">
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>🎬 Медиатека</h2>
        <div class="search-box">
          <input type="text" id="search-files" placeholder="Поиск файлов...">
        </div>
        <div class="category-tabs" id="category-tabs">
          <button class="category-btn active" data-category="all">Все</button>
        </div>
      </div>
      <div class="file-list" id="file-list">
        <div class="no-files">Загрузка...</div>
      </div>
    </div>
    <div class="video-wrapper" id="video-wrapper">
      <video id="video" controls playsinline></video>
      <button class="chat-toggle-btn" id="chat-toggle-btn" title="Открыть чат">💬</button>
      <div class="chat-popup" id="chat-popup">
      <div class="chat-popup-header">
        <span>💬 Чат с AI</span>
        <div class="chat-window-controls">
          <button class="chat-window-btn settings" id="chat-settings-btn" title="Настройки">⚙️</button>
          <button class="chat-window-btn maximize" id="chat-max-btn" title="Развернуть">▉▉</button>
          <button class="chat-window-btn minimize" id="chat-min-btn" title="Свернуть в стандарт">_</button>
          <button class="chat-window-btn close" id="chat-close-btn" title="Закрыть">✕</button>
        </div>
      </div>
      <!-- Collapsible Chat Settings Panel -->
      <div id="chat-popup-settings-panel" class="d-none" style="background: rgba(0,0,0,0.4); border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 12px; color: #ccc; padding: 12px 15px;">
        <div style="margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px;">
          <label for="chat-popup-temp" style="flex: 1;">Temperature: <strong id="chat-popup-temp-val">1.0</strong></label>
          <input type="range" id="chat-popup-temp" min="0" max="2" step="0.1" value="1.0" style="width: 120px; cursor: pointer;">
        </div>
        <div style="margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px;">
          <label for="chat-popup-topp" style="flex: 1;">Top P: <strong id="chat-popup-topp-val">0.95</strong></label>
          <input type="range" id="chat-popup-topp" min="0" max="1" step="0.05" value="0.95" style="width: 120px; cursor: pointer;">
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
          <label for="chat-popup-topk" style="flex: 1;">Top K: <strong id="chat-popup-topk-val">40</strong></label>
          <input type="range" id="chat-popup-topk" min="1" max="100" step="1" value="40" style="width: 120px; cursor: pointer;">
        </div>
      </div>
      <div class="chat-popup-messages" id="chat-popup-messages">
          <div class="chat-popup-msg bot"><strong>Ai Ассистент</strong> (System): Добро пожаловать в чат плеера! Можете спрашивать о воспроизводимом медиафайле или задавать другие вопросы.</div>
      </div>
      <div class="chat-popup-input-area">
        <input type="text" id="chat-popup-input" placeholder="Задайте вопрос...">
        <button id="chat-popup-send">Отправить</button>
      </div>
    </div>
    </div>
    <div class="controls">
      <span class="file-info" id="file-info">Выберите файл для воспроизведения</span>
      <button class="btn btn-secondary btn-sm" onclick="closePlayer()">Закрыть</button>
    </div>
  </div>

  <script src="/html/js/chatService.js?v=20260725"></script>
  <script>
    let mediaData = null;
    let currentCategory = 'all';
    let currentFiles = [];

    // Загрузка медиафайлов
    async function loadMediaFiles() {
      const fileList = document.getElementById('file-list');
      fileList.innerHTML = '<div class="no-files">Загрузка...</div>';
      
      try {
        const response = await fetch('/api/media/by-category');
        mediaData = await response.json();
        
        if (mediaData.error) {
          fileList.innerHTML = `<div class="error">${mediaData.error}</div>`;
          return;
        }
        
        renderCategoryTabs();
        filterFiles();
      } catch (e) {
        fileList.innerHTML = `<div class="error">Ошибка загрузки: ${e.message}</div>`;
        console.error('loadMediaFiles:', e);
      }
    }

    // Рендеринг вкладок категорий
    function renderCategoryTabs() {
      const tabs = document.getElementById('category-tabs');
      const btnAll = tabs.querySelector('.category-btn');
      btnAll.textContent = 'Все';
      
      mediaData.categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'category-btn';
        btn.textContent = cat;
        btn.dataset.category = cat;
        btn.onclick = () => switchCategory(cat, btn);
        tabs.appendChild(btn);
      });
    }

    // Переключение категории
    function switchCategory(category, btn) {
      currentCategory = category;
      
      document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      filterFiles();
    }

    // Фильтрация файлов
    function filterFiles() {
      const searchInput = document.getElementById('search-files');
      const searchQuery = searchInput.value.toLowerCase();
      
      const fileList = document.getElementById('file-list');
      
      if (!mediaData || !mediaData.categories.length) {
        fileList.innerHTML = '<div class="no-files">Нет доступных файлов</div>';
        return;
      }

      let files = [];
      if (currentCategory === 'all') {
        Object.values(mediaData.movies).forEach(list => files.push(...list));
        Object.values(mediaData.series).forEach(list => files.push(...list));
      } else {
        if (mediaData.movies[currentCategory]) files.push(...mediaData.movies[currentCategory]);
        if (mediaData.series[currentCategory]) files.push(...mediaData.series[currentCategory]);
      }

      // Фильтрация по поиску
      if (searchQuery) {
        files = files.filter(f => 
          f.name.toLowerCase().includes(searchQuery) ||
          f.title_orig?.toLowerCase().includes(searchQuery) ||
          f.title_ru?.toLowerCase().includes(searchQuery)
        );
      }

      currentFiles = files;
      
      if (!files.length) {
        fileList.innerHTML = '<div class="no-files">Файлы не найдены</div>';
        return;
      }

      fileList.innerHTML = files.map((f, i) => `
        <div class="file-item" onclick="openFile(${i})" id="file-${i}">
          <div class="file-name">
            <span class="file-type ${f.type === 'series' ? 'series' : 'movie'}">${f.type === 'series' ? 'Сериал' : 'Фильм'}</span>
            ${f.name}
          </div>
          <div class="file-meta">
            ${f.year ? f.year + ' • ' : ''}${f.disk_name || ''}
          </div>
        </div>
      `).join('');

      sendPlaylistUpdate();
    }

    let lastSavedTime = 0;

    async function saveWatchProgressToServer(force = false) {
      const video = document.getElementById('video');
      if (currentIndex < 0 || currentIndex >= currentFiles.length) return;
      const file = currentFiles[currentIndex];
      if (!file || !file.path || !video.duration) return;

      const now = Date.now();
      if (!force && (now - lastSavedTime < 5000)) return; // Throttling: каждые 5 секунд
      lastSavedTime = now;

      try {
        await fetch('/api/media/progress', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            file_path: file.path,
            file_name: file.name,
            current_time: video.currentTime || 0,
            duration: video.duration || 0
          })
        });
      } catch (e) {
        console.error('Error saving watch progress:', e);
      }
    }

    // Открытие файла
    async function openFile(index, targetPosition = null) {
      if (index < 0 || index >= currentFiles.length) return;
      const file = currentFiles[index];
      if (!file || !file.path) return;
      
      currentIndex = index;

      // Активация выбранного файла
      document.querySelectorAll('.file-item').forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });
      
      // Запуск плеера
      const video = document.getElementById('video');
      const fileInfo = document.getElementById('file-info');
      
      fileInfo.textContent = `${file.name} (${file.year || ''}) - ${file.path}`;
      
      // Загрузка сохранённой позиции
      let resumeTime = targetPosition;
      if (resumeTime === null) {
        try {
          const r = await fetch(`/api/media/progress?file_path=${encodeURIComponent(file.path)}`);
          if (r.ok) {
            const data = await r.json();
            if (data.progress && data.progress.last_position > 0 && !data.progress.completed) {
              resumeTime = data.progress.last_position;
            }
          }
        } catch (e) {
          console.error('Error fetching position:', e);
        }
      }

      video.src = 'file://' + file.path;
      
      if (resumeTime && resumeTime > 5) {
        const onLoaded = () => {
          video.currentTime = resumeTime;
          video.removeEventListener('loadedmetadata', onLoaded);
        };
        video.addEventListener('loadedmetadata', onLoaded);
      }
      
      video.play().catch(() => {
        console.log('Autoplay blocked - user interaction needed');
      });

      sendStatusUpdate();
    }

    function playRandomMovie() {
      if (!mediaData || !mediaData.movies) return;
      let allMovies = [];
      Object.values(mediaData.movies).forEach(list => {
        allMovies.push(...list);
      });
      if (allMovies.length === 0) return;
      const randomMovie = allMovies[Math.floor(Math.random() * allMovies.length)];
      
      // Reset search and switch to 'all' category
      const searchInput = document.getElementById('search-files');
      if (searchInput) searchInput.value = '';
      
      currentCategory = 'all';
      document.querySelectorAll('.category-btn').forEach(b => {
        if (b.dataset.category === 'all') {
          b.classList.add('active');
        } else {
          b.classList.remove('active');
        }
      });
      
      filterFiles();
      
      const index = currentFiles.findIndex(f => f.path === randomMovie.path);
      if (index !== -1) {
        openFile(index);
      }
    }

    // ── WEBSOCKET CONTROL & SYNC ─────────────────────────────────────────────
    let ws = null;
    let cachedUserEmail = 'default';

    async function initControlWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      let email = cachedUserEmail;
      try {
        const authRes = await fetch('/auth/check');
        if (authRes.ok) {
          const authData = await authRes.json();
          if (authData.authenticated && authData.email) {
            email = authData.email.trim().toLowerCase();
            cachedUserEmail = email;
          } else {
            email = 'default';
            cachedUserEmail = email;
          }
        } else {
          console.warn(`Auth check response not OK (${authRes.status}), using cached email: ${email}`);
        }
      } catch (e) {
        console.error('Failed to check auth for websocket room, using cached email:', e);
      }
      
      const wsUrl = `${protocol}//${window.location.host}/api/control/ws?role=player&room=${encodeURIComponent(email)}`;
      
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        console.log('Player WebSocket control connected');
        sendStatusUpdate();
        sendPlaylistUpdate();
      };

      ws.onmessage = (event) => {
        try {
          const cmd = JSON.parse(event.data);
          handleRemoteCommand(cmd);
        } catch (e) {
          console.error('Error handling remote command:', e);
        }
      };

      ws.onclose = () => {
        console.log('Player WebSocket control closed. Reconnecting in 3s...');
        setTimeout(initControlWebSocket, 3000);
      };

      ws.onerror = (err) => {
        console.error('Player WebSocket error:', err);
      };
    }

    function handleRemoteCommand(cmd) {
      const video = document.getElementById('video');
      if (!cmd || !cmd.action) return;

      switch (cmd.action) {
        case 'play':
          video.play().catch(console.error);
          break;
        case 'pause':
          video.pause();
          break;
        case 'toggle_play':
          if (video.paused) video.play().catch(console.error);
          else video.pause();
          break;
        case 'seek':
          if (typeof cmd.seconds === 'number') video.currentTime = cmd.seconds;
          break;
        case 'set_volume':
          if (typeof cmd.level === 'number') video.volume = Math.max(0, Math.min(1, cmd.level));
          break;
        case 'play_file':
          if (typeof cmd.index === 'number') openFile(cmd.index);
          break;
        case 'play_file_by_path':
          if (cmd.path) {
            let idx = currentFiles.findIndex(f => f.path === cmd.path);
            if (idx === -1) {
              currentCategory = 'all';
              document.querySelectorAll('.category-btn').forEach(b => {
                if (b.dataset.category === 'all') b.classList.add('active');
                else b.classList.remove('active');
              });
              filterFiles();
              idx = currentFiles.findIndex(f => f.path === cmd.path);
            }
            if (idx !== -1) openFile(idx);
          }
          break;
        case 'play_random_movie':
          playRandomMovie();
          break;
        case 'next':
          if (currentIndex < currentFiles.length - 1) openFile(currentIndex + 1);
          break;
        case 'prev':
          if (currentIndex > 0) openFile(currentIndex - 1);
          break;
      }
    }

    function sendStatusUpdate() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const video = document.getElementById('video');
      const currentFile = currentIndex >= 0 ? currentFiles[currentIndex] : null;

      ws.send(JSON.stringify({
        event: 'status_update',
        isPlaying: !video.paused && !video.ended,
        currentTime: video.currentTime || 0,
        duration: video.duration || 0,
        volume: video.volume,
        muted: video.muted,
        fileName: currentFile ? currentFile.name : 'Файл не выбран',
        currentIndex: currentIndex
      }));
    }

    function sendPlaylistUpdate() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const filesSummary = currentFiles.map((f, i) => ({
        index: i,
        name: f.name,
        type: f.type,
        year: f.year
      }));

      ws.send(JSON.stringify({
        event: 'playlist_update',
        files: filesSummary
      }));
    }

    // Слушатели событий видеоплеера
    const videoElem = document.getElementById('video');
    ['timeupdate', 'play', 'pause', 'volumechange', 'loadedmetadata', 'ended'].forEach(evt => {
      videoElem.addEventListener(evt, sendStatusUpdate);
    });

    videoElem.addEventListener('timeupdate', () => saveWatchProgressToServer(false));
    ['pause', 'ended', 'seeking'].forEach(evt => {
      videoElem.addEventListener(evt, () => saveWatchProgressToServer(true));
    });

    // Поиск
    document.getElementById('search-files')?.addEventListener('input', filterFiles);

    // Закрытие плеера
    window.closePlayer = function() {
      window.close();
    };

    // Логика всплывающего чата
    const chatToggleBtn = document.getElementById('chat-toggle-btn');
    const chatPopup = document.getElementById('chat-popup');
    const chatCloseBtn = document.getElementById('chat-close-btn');
    const chatMaxBtn = document.getElementById('chat-max-btn');
    const chatMinBtn = document.getElementById('chat-min-btn');
    const chatPopupSend = document.getElementById('chat-popup-send');
    const chatPopupInput = document.getElementById('chat-popup-input');
    const chatPopupMessages = document.getElementById('chat-popup-messages');

    // Настройки чата
    const chatSettingsBtn = document.getElementById('chat-settings-btn');
    const chatSettingsPanel = document.getElementById('chat-popup-settings-panel');
    const chatPopupTemp = document.getElementById('chat-popup-temp');
    const chatPopupTempVal = document.getElementById('chat-popup-temp-val');
    const chatPopupTopP = document.getElementById('chat-popup-topp');
    const chatPopupTopPVal = document.getElementById('chat-popup-topp-val');
    const chatPopupTopK = document.getElementById('chat-popup-topk');
    const chatPopupTopKVal = document.getElementById('chat-popup-topk-val');

    if (chatSettingsBtn && chatSettingsPanel) {
      chatSettingsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        chatSettingsPanel.classList.toggle('d-none');
      });
    }

    if (chatPopupTemp && chatPopupTempVal) {
      chatPopupTemp.addEventListener('input', () => {
        chatPopupTempVal.textContent = chatPopupTemp.value;
      });
    }
    if (chatPopupTopP && chatPopupTopPVal) {
      chatPopupTopP.addEventListener('input', () => {
        chatPopupTopPVal.textContent = chatPopupTopP.value;
      });
    }
    if (chatPopupTopK && chatPopupTopKVal) {
      chatPopupTopK.addEventListener('input', () => {
        chatPopupTopKVal.textContent = chatPopupTopK.value;
      });
    }

    let isChatMaximized = false;

    function setChatPopupState(maximized) {
      isChatMaximized = maximized;
      if (maximized) {
        chatPopup.classList.add('maximized');
        if (chatMaxBtn) chatMaxBtn.innerHTML = '□';
        if (chatMinBtn) chatMinBtn.innerHTML = '_';
      } else {
        chatPopup.classList.remove('maximized');
        if (chatMaxBtn) chatMaxBtn.innerHTML = '▉▉';
        if (chatMinBtn) chatMinBtn.innerHTML = '_';
      }
    }

    if (chatToggleBtn && chatPopup) {
      chatToggleBtn.addEventListener('click', () => {
        chatPopup.classList.toggle('show');
        if (chatPopup.classList.contains('show')) {
          chatPopupInput.focus();
          setChatPopupState(false);
        }
      });
    }

    if (chatCloseBtn && chatPopup) {
      chatCloseBtn.addEventListener('click', () => {
        chatPopup.classList.remove('show');
      });
    }

    if (chatMaxBtn && chatPopup) {
      chatMaxBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        setChatPopupState(!isChatMaximized);
      });
    }

    if (chatMinBtn && chatPopup) {
      chatMinBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        setChatPopupState(false);
      });
    }

    async function sendPopupMessage() {
      const msg = chatPopupInput.value.trim();
      if (!msg) return;

      addPopupMessage('user', msg);
      chatPopupInput.value = '';
      chatPopupSend.disabled = true;
      chatPopupSend.textContent = '⏳';

      const generationConfig = {
        temperature: parseFloat(chatPopupTemp?.value || '1.0'),
        top_p: parseFloat(chatPopupTopP?.value || '0.95'),
        top_k: parseInt(chatPopupTopK?.value || '40', 10)
      };

      try {
        const reply = await window.chatService.sendChatMessage(msg, null, [], generationConfig);
        addPopupMessage('bot', reply.text);
        window.chatService.speak(reply.voice || reply.text);
      } catch (e) {
        addPopupMessage('bot', e.message || e);
      } finally {
        chatPopupSend.disabled = false;
        chatPopupSend.textContent = 'Отправить';
      }
    }

    function addPopupMessage(sender, text) {
      const el = document.createElement('div');
      el.className = `chat-popup-msg ${sender}`;
      
      let displayText;
      if (typeof text === 'object' && text !== null) {
        displayText = window.chatService.formatMessage(text);
      } else {
        displayText = text;
      }
      
      el.innerHTML = `<strong>${sender === 'user' ? 'Вы' : 'Ai Ассистент'}</strong>: ${displayText}`;
      chatPopupMessages.appendChild(el);
      chatPopupMessages.scrollTop = chatPopupMessages.scrollHeight;
    }

    if (chatPopupSend) {
      chatPopupSend.addEventListener('click', sendPopupMessage);
    }
    if (chatPopupInput) {
      chatPopupInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendPopupMessage();
      });
    }

    // Инициализация
    document.addEventListener('DOMContentLoaded', async () => {
      await loadMediaFiles();
      initControlWebSocket();

      // Авто-открытие файла из параметров URL ?file=...
      const urlParams = new URLSearchParams(window.location.search);
      const targetFile = urlParams.get('file');
      if (targetFile) {
        const decodedPath = decodeURIComponent(targetFile);
        const idx = currentFiles.findIndex(f => f.path === decodedPath || f.path.toLowerCase() === decodedPath.toLowerCase());
        if (idx !== -1) {
          openFile(idx);
        }
      }
    });
  </script>
</body>
</html>
