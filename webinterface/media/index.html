<!-- Media Organizer Tab -->
<div class="row g-3 mb-3">
  <!-- LEFT: пути сканирования -->
  <div class="col-md-3">
    <div class="card h-100">
      <div class="card-header py-2" data-i18n="media.scanPaths">📁 Пути сканирования <button class="btn btn-sm btn-outline-primary ms-2" onclick="showHelpModal('media_paths')">?</button></div>
      <div class="card-body d-flex flex-column gap-2">
        <div id="media-paths-list" class="border rounded p-2 flex-grow-1"
             style="overflow-y:auto;max-height:300px;min-height:60px;background:#fff;">
          <div class="text-muted small" id="media-paths-empty" data-i18n="media.noPaths">Нет путей</div>
        </div>
        <div class="input-group input-group-sm">
          <input type="text" class="form-control font-monospace" id="media-path-input"
                 data-i18n-placeholder="media.addPathPlaceholder" placeholder="D:\Series">
          <button class="btn btn-outline-primary" id="btn-media-add-path" data-i18n="media.addPath">+</button>
        </div>
        <div class="d-grid gap-1">
          <button class="btn btn-primary btn-sm" id="btn-series-scan" data-i18n="media.scanSeries">🔍 Сканировать сериалы</button>
        </div>
      </div>
    </div>
  </div>

  <!-- CENTER: сводка по сериалам -->
  <div class="col-md-5">
    <div class="card mb-3">
      <div class="card-header d-flex justify-content-between align-items-center py-2">
        <span data-i18n="media.series">📺 Сериалы</span> <span class="badge bg-secondary" id="media-series-count">0</span>
        <button class="btn btn-sm btn-outline-primary me-2" onclick="showHelpModal('media_summary')">?</button>
        <button class="btn btn-outline-secondary btn-sm" id="btn-media-load-summary">🔄</button>
      </div>
      <div class="card-body p-0" style="overflow-y:auto;max-height:340px;">
        <table class="table table-sm table-hover mb-0" id="media-summary-table">
          <thead class="table-dark sticky-top">
            <tr>
              <th data-i18n="media.series">Сериал</th>
              <th style="width:70px" class="text-center" data-i18n="media.seasons">Сезонов</th>
              <th style="width:80px" class="text-center" data-i18n="media.episodes">Эпизодов</th>
              <th style="width:80px" class="text-center" data-i18n="media.size">Размер</th>
            </tr>
          </thead>
          <tbody id="media-summary-body"></tbody>
        </table>
        <div id="media-summary-empty" class="text-center text-muted p-3 d-none" data-i18n="media.noData">Нет данных. Запустите сканирование.</div>
      </div>
    </div>
  </div>

  <!-- RIGHT: дубликаты + целостность -->
  <div class="col-md-4">
    <div class="card mb-3">
      <div class="card-header d-flex justify-content-between align-items-center py-2">
        <span data-i18n="media.duplicates">⚠️ Дубликаты сезонов</span> <span class="badge bg-warning text-dark" id="dup-count">0</span>
        <button class="btn btn-sm btn-outline-primary me-2" onclick="showHelpModal('media_duplicates')">?</button>
        <button class="btn btn-outline-secondary btn-sm" id="btn-check-dups" data-i18n="media.check">Проверить</button>
      </div>
      <div class="card-body p-0" style="overflow-y:auto;max-height:150px;">
        <div id="dup-body" class="p-2 small"><span class="text-muted" data-i18n="media.pressCheck">Нажмите «Проверить»</span></div>
      </div>
    </div>
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center py-2">
        <span data-i18n="media.integrity">🔎 Целостность</span> <span class="badge bg-danger" id="integrity-count">0</span>
        <button class="btn btn-sm btn-outline-primary me-2" onclick="showHelpModal('media_integrity')">?</button>
        <button class="btn btn-outline-secondary btn-sm" id="btn-check-integrity" data-i18n="media.check">Проверить</button>
      </div>
      <div class="card-body p-0" style="overflow-y:auto;max-height:150px;">
        <div id="integrity-body" class="p-2 small"><span class="text-muted" data-i18n="media.pressCheck">Нажмите «Проверить»</span></div>
      </div>
    </div>
  </div>
</div>

<!-- RAG Section -->
<div class="row mt-3">
  <div class="col">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center py-2">
        <span data-i18n="media.ragIndex">🧠 RAG Индекс медиатеки</span> <span class="badge bg-info" id="rag-docs-count">0</span>
        <div class="d-flex gap-2">
          <select class="form-select form-select-sm" id="rag-key-select" style="width:auto;">
            <option value="" data-i18n="media.apiKey">API Key</option>
          </select>
          <button class="btn btn-success btn-sm" id="btn-rag-build" data-i18n="media.buildIndex">🔨 Построить индекс</button>
        </div>
      </div>
      <div class="card-body">
        <!-- Status Row -->
        <div class="row mb-3">
          <div class="col-md-3">
            <div class="card bg-light">
              <div class="card-body p-2 text-center">
                <div class="h5 mb-0" id="rag-db-records">0</div>
                <small class="text-muted" data-i18n="media.dbRecords">Записей в БД</small>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card bg-light">
              <div class="card-body p-2 text-center">
                <div class="h5 mb-0" id="rag-index-docs">0</div>
                <small class="text-muted" data-i18n="media.indexDocs">Документов в индексе</small>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card bg-light">
              <div class="card-body p-2 text-center">
                <div class="h5 mb-0" id="rag-movies-count">0</div>
                <small class="text-muted" data-i18n="media.movies">Фильмов</small>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card bg-light">
              <div class="card-body p-2 text-center">
                <div class="h5 mb-0" id="rag-series-count">0</div>
                <small class="text-muted" data-i18n="media.seriesCount">Сериалов</small>
              </div>
            </div>
          </div>
        </div>

        <!-- Search Row -->
        <div class="row">
          <div class="col-md-8">
            <div class="input-group">
              <input type="text" class="form-control" id="rag-search-input"
                     data-i18n-placeholder="media.searchPlaceholder" placeholder="Поиск фильмов и сериалов: 'фильм про космос', 'сериал похожий на Кейна'...">
              <button class="btn btn-primary" id="btn-rag-search" data-i18n="media.search">🔍 Поиск</button>
              <select class="form-select" id="rag-search-category" style="max-width:150px;">
                <option value="" data-i18n="media.allCategories">Все категории</option>
                <option value="Боевики" data-i18n="media.action">Боевики</option>
                <option value="Триллеры" data-i18n="media.thriller">Триллеры</option>
                <option value="Военные" data-i18n="media.war">Военные</option>
                <option value="Аферы" data-i18n="media.con">Аферы</option>
                <option value="Приключения" data-i18n="media.adventure">Приключения</option>
                <option value="Семейные" data-i18n="media.family">Семейные</option>
                <option value="Исторические/Костюмированные" data-i18n="media.historical">Исторические</option>
                <option value="Расследования" data-i18n="media.investigation">Расследования</option>
                <option value="Деньги/Корпорации" data-i18n="media.money">Деньги</option>
                <option value="Шпионы" data-i18n="media.spy">Шпионы</option>
                <option value="Мюзиклы" data-i18n="media.musical">Мюзиклы</option>
              </select>
            </div>
          </div>
          <div class="col-md-4">
            <select class="form-select" id="rag-search-type">
              <option value="" data-i18n="media.allTypes">Все типы</option>
              <option value="movie" data-i18n="media.moviesType">Фильмы</option>
              <option value="series" data-i18n="media.seriesType">Сериалы</option>
            </select>
          </div>
        </div>

        <!-- Results -->
        <div class="mt-3" id="rag-search-results" style="max-height:300px;overflow-y:auto;"></div>
      </div>
    </div>
  </div>
</div>

<!-- Отчёт -->
<div class="row mt-3">
  <div class="col">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center py-2">
        <span data-i18n="media.report">📄 Последний отчёт</span> <button class="btn btn-sm btn-outline-primary ms-2" onclick="showHelpModal('media_report')">?</button>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-secondary btn-sm" id="btn-load-series-report" data-i18n="media.load">Загрузить</button>
          <a class="btn btn-outline-primary btn-sm" id="btn-download-series-report"
             href="/api/media/series/report" download="series_report.md" data-i18n="media.download">⬇ Скачать</a>
        </div>
      </div>
      <div class="card-body p-2">
        <div id="media-log"></div>
      </div>
    </div>
  </div>
</div>
