<div class="container-fluid mt-2">
  <div class="alert alert-info d-flex flex-wrap align-items-center gap-2">
    <div class="flex-grow-1">
      <h5 class="mb-1">🧠 Управление RAG</h5>
      <p class="mb-0 small">Семантический поиск и управление базой знаний RAG (Retrieval-Augmented Generation).</p>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="card mb-3">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>🧠 RAG-индекс</span>
          <div class="d-flex align-items-center">
            <div class="form-check form-switch me-3 mb-0">
              <input class="form-check-input" type="checkbox" id="admin-rag-toggle" checked onchange="toggleRag(this.checked)">
              <label class="form-check-label small" for="admin-rag-toggle">Вкл</label>
            </div>
            <button class="btn btn-sm btn-outline-primary me-1" onclick="showHelpModal('rag')">?</button>
            <button class="btn btn-outline-secondary btn-sm me-1" title="Загрузить JSON в RAG" id="btn-admin-rag-json">➕ JSON</button>
            <button class="btn btn-outline-info btn-sm" id="btn-admin-rag-build">Построить</button>
          </div>
        </div>
        <div class="card-body p-2">
          <!-- RAG Status badges -->
          <div id="admin-rag-status" class="mb-2">
            <span class="badge bg-secondary">Загрузка...</span>
          </div>

          <p class="small text-muted mb-2">Семантический поиск по медиатеке</p>

          <!-- RAG Search -->
          <div class="input-group input-group-sm mb-1">
            <input type="text" class="form-control" id="admin-rag-query"
              placeholder="Введите запрос (напр: фильм про войну)">
            <button class="btn btn-outline-primary" id="btn-admin-rag-search">🔍 Поиск</button>
          </div>

          <!-- RAG Search Results -->
          <div id="admin-rag-results" class="small text-muted mt-1"
            style="max-height:400px; overflow-y:auto;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- RAG JSON Upload Modal -->
  <div class="modal fade" id="ragJsonModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Добавить JSON в RAG</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <button type="button" class="btn btn-sm btn-outline-info w-100 mb-3" id="btn-submit-rag-dir">📂 Сканировать папку .files_for_rag</button>
          
          <div class="mb-3">
            <label class="form-label small">Или загрузить файл .json</label>
            <input class="form-control form-control-sm" type="file" id="rag-json-file" accept=".json">
          </div>
          <div class="mb-3">
            <label class="form-label small">Или вставьте JSON текст (список объектов)</label>
            <textarea class="form-control text-muted small" style="font-family: monospace;" id="rag-json-text" rows="8" placeholder='[
  {
    "text": "Текст для векторизации",
    "meta": {"title": "Документ 1"}
  }
]'></textarea>
          </div>
        </div>
        <div class="modal-footer p-1">
          <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Отмена</button>
          <button type="button" class="btn btn-sm btn-primary" id="btn-submit-rag-json">Записать в RAG</button>
        </div>
      </div>
    </div>
  </div>
</div>
