<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Assistant - Telegram Mini App</title>
  
  <!-- Telegram Web Apps SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  
  <!-- i18next -->
  <script src="https://cdn.jsdelivr.net/npm/i18next@23.11.5/i18next.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- Telegram Mini App Styles -->
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* Telegram Theme Colors Variables */
    :root {
      --tg-theme-bg-color: var(--tg-theme-bg-color, #0d1117);
      --tg-theme-text-color: var(--tg-theme-text-color, #c9d1d9);
      --tg-theme-hint-color: var(--tg-theme-hint-color, #8b949e);
      --tg-theme-link-color: var(--tg-theme-link-color, #58a6ff);
      --tg-theme-button-color: var(--tg-theme-button-color, #238636);
      --tg-theme-button-text-color: var(--tg-theme-button-text-color, #ffffff);
      --tg-theme-secondary-bg-color: var(--tg-theme-secondary-bg-color, #161b22);
    }
    
    body {
      background-color: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    
    .nav-tabs .nav-link {
      color: var(--tg-theme-hint-color);
      border: none;
      border-bottom: 2px solid transparent;
      background: transparent;
    }
    
    .nav-tabs .nav-link:hover {
      color: var(--tg-theme-text-color);
    }
    
    .nav-tabs .nav-link.active {
      color: var(--tg-theme-link-color);
      background: transparent;
      border-bottom-color: var(--tg-theme-link-color);
    }
    
    .chat-window {
      background-color: var(--tg-theme-secondary-bg-color);
      border-radius: 8px;
      padding: 15px;
      height: 60vh;
      overflow-y: auto;
    }
    
    .chat-message {
      margin-bottom: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      max-width: 85%;
    }
    
    .chat-message.user {
      background-color: var(--tg-theme-button-color);
      color: var(--tg-theme-button-text-color);
      margin-left: auto;
    }
    
    .chat-message.assistant {
      background-color: #21262d;
      color: var(--tg-theme-text-color);
    }
    
    .input-group {
      background-color: var(--tg-theme-secondary-bg-color);
      border-radius: 8px;
      padding: 10px;
    }
    
    .form-control {
      background-color: var(--tg-theme-bg-color);
      border: 1px solid #30363d;
      color: var(--tg-theme-text-color);
    }
    
    .form-control:focus {
      background-color: var(--tg-theme-bg-color);
      border-color: var(--tg-theme-button-color);
      color: var(--tg-theme-text-color);
      box-shadow: 0 0 0 2px rgba(56,139,253,0.3);
    }
    
    .btn-primary {
      background-color: var(--tg-theme-button-color);
      border-color: var(--tg-theme-button-color);
      color: var(--tg-theme-button-text-color);
    }
    
    .btn-primary:hover {
      background-color: #2ea043;
      border-color: #2ea043;
      color: var(--tg-theme-button-text-color);
    }
    
    .player-container {
      background-color: var(--tg-theme-secondary-bg-color);
      border-radius: 8px;
      padding: 20px;
      height: 70vh;
    }
    
    .video-wrapper {
      background: #000;
      border-radius: 8px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .video-wrapper video {
      max-width: 100%;
      max-height: 100%;
    }
    
    .file-list {
      background-color: var(--tg-theme-secondary-bg-color);
      border-radius: 8px;
      padding: 15px;
      max-height: 30vh;
      overflow-y: auto;
    }
    
    .file-item {
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 4px;
    }
    
    .file-item:hover {
      background-color: #21262d;
    }
    
    .file-item.active {
      background-color: var(--tg-theme-button-color);
    }
    
    .lang-selector {
      background-color: #21262d !important;
      border-color: #30363d !important;
      color: var(--tg-theme-text-color) !important;
    }
    
    .telegram-status {
      position: fixed;
      bottom: 10px;
      right: 10px;
      font-size: 0.8rem;
      color: var(--tg-theme-hint-color);
    }
  </style>
</head>
<body>
  <div class="container-fluid mt-3">
    <ul class="nav nav-tabs mb-3" id="mainTabs">
      <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-remote" data-i18n="tabs.remote">
          <i class="bi bi-phone-vibrate"></i> Пульт ДУ
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-player" data-i18n="tabs.player">
          <i class="bi bi-play-circle"></i> Локальный плеер
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-chat" data-i18n="tabs.chat">
          <i class="bi bi-chat-dots"></i> Чат
        </button>
      </li>
      <li class="nav-item ms-auto">
        <select class="form-select form-select-sm lang-selector" id="lang-selector" style="width:auto;">
          <option value="ru">Русский</option>
          <option value="en">English</option>
        </select>
      </li>
    </ul>


    <div class="tab-content">
      <!-- Remote Control Tab -->
      <div id="tab-remote" class="tab-pane fade show active">
        <div class="card bg-dark text-white border-secondary p-3">
          <!-- Connection Status Header -->
          <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="badge bg-secondary" id="remote-ws-status"><i class="bi bi-wifi-off"></i> Подключение...</span>
            <small class="text-muted" id="remote-room-info">Комната: default</small>
          </div>

          <!-- Now Playing Card -->
          <div class="text-center my-2 p-3 rounded" style="background: rgba(255,255,255,0.05);">
            <i class="bi bi-disc fs-1 text-primary mb-2 d-block" id="remote-disc-icon"></i>
            <h6 id="remote-track-title" class="mb-1 text-truncate">Файл не выбран</h6>
            <small id="remote-time-display" class="text-muted">00:00 / 00:00</small>
            
            <!-- Progress Seek Bar -->
            <div class="mt-2">
              <input type="range" class="form-range" id="remote-seek-slider" min="0" max="100" value="0">
            </div>
          </div>

          <!-- Big Playback Controls -->
          <div class="d-flex justify-content-center align-items-center gap-3 my-3">
            <button class="btn btn-outline-light btn-lg rounded-circle" id="remote-btn-prev" title="Предыдущий"><i class="bi bi-skip-start-fill"></i></button>
            <button class="btn btn-primary btn-lg rounded-circle p-3" style="width:64px; height:64px;" id="remote-btn-playtoggle" title="Воспроизведение/Пауза"><i class="bi bi-play-fill fs-2" id="remote-play-icon"></i></button>
            <button class="btn btn-outline-light btn-lg rounded-circle" id="remote-btn-next" title="Следующий"><i class="bi bi-skip-end-fill"></i></button>
          </div>

          <!-- Volume slider -->
          <div class="d-flex align-items-center gap-2 mt-2">
            <i class="bi bi-volume-down text-muted"></i>
            <input type="range" class="form-range" id="remote-volume-slider" min="0" max="1" step="0.05" value="1">
            <i class="bi bi-volume-up text-muted"></i>
          </div>

          <!-- Voice Control -->
          <div class="mt-4 p-3 rounded border border-secondary bg-dark bg-opacity-25 text-center">
            <h6><i class="bi bi-mic"></i> Голосовое управление</h6>
            <div class="d-flex justify-content-center align-items-center my-3">
              <button class="btn btn-outline-danger btn-circle-lg mx-auto" id="remote-btn-mic" title="Нажмите, чтобы говорить" style="width: 56px; height: 56px; border-radius: 50%;">
                <i class="bi bi-mic-fill fs-4" id="remote-mic-icon"></i>
              </button>
            </div>
            <div class="text-muted small mt-2" id="remote-voice-status">Нажмите кнопку для управления голосом</div>
            <div class="mt-3 p-2 rounded bg-dark text-start small border border-secondary text-white" id="remote-voice-log" style="display:none; max-height: 100px; overflow-y: auto; font-family: monospace;"></div>
          </div>

          <!-- Remote Media Selector -->
          <div class="mt-4">
            <h6 class="border-bottom border-secondary pb-2"><i class="bi bi-collection-play"></i> Плейлист плеера</h6>
            <div class="list-group list-group-flush overflow-auto" id="remote-playlist-items" style="max-height: 220px;">
              <div class="text-muted small p-2 text-center">Ожидание подключения к плееру...</div>
            </div>
          </div>
        </div>
      </div>


      <!-- Local Player Tab -->
      <div id="tab-player" class="tab-pane fade">

        <div class="row g-3">
          <div class="col-md-3">
            <div class="file-list" id="file-list">
              <div class="text-muted text-center p-3" data-i18n="player.noFiles">Загрузка файлов...</div>
            </div>
          </div>
          <div class="col-md-9">
            <div class="player-container">
              <div class="video-wrapper" id="video-wrapper">
                <video id="video" controls playsinline></video>
              </div>
            </div>
            <div class="mt-3 d-flex gap-2">
              <button class="btn btn-secondary btn-sm" id="btn-prev" data-i18n="player.prev">⏮ Предыдущий</button>
              <button class="btn btn-secondary btn-sm" id="btn-next" data-i18n="player.next">Следующий ⏭</button>
              <span class="ms-auto text-muted" id="current-file"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Chat Tab -->
      <div id="tab-chat" class="tab-pane fade">
        <div class="chat-window" id="chat-window">
          <div class="text-center text-muted p-4" id="chat-empty" data-i18n="chat.startPrompt">
            Начните разговор с AI
          </div>
        </div>
        <div class="input-group mt-3">
          <input type="text" class="form-control" id="message-input" 
                 data-i18n-placeholder="chat.placeholder" placeholder="Введите сообщение...">
          <button class="btn btn-primary" id="send-button" data-i18n="chat.send">Отправить</button>
        </div>
      </div>
    </div>
  </div>

  <div class="telegram-status" id="tg-status">
    <i class="bi bi-telegram"></i> Telegram Web App
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/html/js/chatService.js"></script>
  
  <!-- Telegram Mini App JS -->
  <script src="main.js"></script>
</body>
</html>
