<!-- Admin Tab -->
<div class="container-fluid">
  <div class="alert alert-info d-flex flex-wrap align-items-center gap-2">
    <div class="flex-grow-1">
      <h5 class="mb-1" data-i18n="admin.title">⚙️ Управление медиатекой</h5>
      <p class="mb-0 small" data-i18n="admin.description">Полный функционал: полное сканирование, аудит, восстановление из JSON, RAG-индекс.</p>
    </div>
    <div class="d-flex gap-2 flex-wrap">
      <button class="btn btn-outline-primary btn-sm" onclick="assignCategoriesFromDB()">
        🏷 Категории торрентам
      </button>
      <button class="btn btn-outline-info btn-sm" onclick="rescanStorage()">
        🔄 Пересканировать диски
      </button>
    </div>
  </div>

<script>
async function rescanStorage() {
  try {
    showNotification('Пересканирование дисков...', 'info');
    const result = await window.api.fetch('/api/control/rescan', { method: 'GET' });
    showNotification('Диски обновлены: ' + (result.drives || 'OK'), 'success');
  } catch (e) {
    showNotification('Ошибка: ' + e.message, 'danger');
  }
}
</script>

  <div class="row g-3">
    <!-- LEFT: диск и пути -->
    <div class="col-6">
      <div class="card">
        <div class="card-header">
          💾 Диск
          <button class="btn btn-sm btn-outline-primary ms-2" onclick="showHelpModal('scan')">?</button>
        </div>
        <div class="card-body">
          <div class="input-group input-group-sm mb-2">
            <span class="input-group-text">Диск</span>
            <input type="text" class="form-control" id="admin-disk-input" value="1">
          </div>
          <div class="mb-2">
            <label class="form-label small text-muted">Пути сканирования</label>
            <div id="admin-paths-list" class="border rounded p-2" style="max-height:200px;overflow-y:auto;">
              <div class="text-muted small">Нет путей</div>
            </div>
            <div class="input-group input-group-sm mt-1">
              <input type="text" class="form-control" id="admin-path-input" placeholder="D:\Series">
              <button class="btn btn-outline-primary" id="btn-admin-add-path">+</button>
            </div>
          </div>
          <div class="d-grid gap-1">
            <button class="btn btn-primary btn-sm" id="btn-admin-scan">🔍 Полное сканирование</button>
          </div>
        </div>
      </div>
    </div>

    <!-- CENTER: аудит и восстановление -->
    <div class="col-6">
      <div class="card mb-3">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>🗂 Аудит БД</span>
          <div>
            <button class="btn btn-sm btn-outline-primary me-1" onclick="showHelpModal('audit')">?</button>
            <button class="btn btn-outline-warning btn-sm" id="btn-admin-audit">Запустить</button>
          </div>
        </div>
        <div class="card-body p-2">
          <div id="admin-audit-body" class="small text-muted">Сверяет таблицу media с файлами на диске</div>
        </div>
      </div>
      <div class="card mb-3">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>🔧 Восстановление БД</span>
          <div>
            <button class="btn btn-sm btn-outline-primary me-1" onclick="showHelpModal('rebuild')">?</button>
            <button class="btn btn-outline-success btn-sm" id="btn-admin-rebuild">Восстановить</button>
          </div>
        </div>
        <div class="card-body p-2">
          <div id="admin-rebuild-body" class="small text-muted">Консолидация дублирующихся записей в БД</div>
        </div>
      </div>
    </div>
  </div>
</div>
