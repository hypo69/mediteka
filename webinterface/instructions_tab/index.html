<!-- Instructions Tab -->
<div class="container-fluid p-3">
  <div class="alert alert-info">
    <h5 class="mb-1"><i class="bi bi-gear"></i> Редактор системных инструкций</h5>
    <p class="mb-0 small">Управление системными инструкциями AI: чат иNarrator режимы, версионирование, проверка в модели.</p>
  </div>

  <!-- Mode Switcher -->
  <div class="card mb-3">
    <div class="card-body">
      <div class="d-flex align-items-center gap-2">
        <span class="text-muted">Режим:</span>
        <div class="btn-group" role="group">
          <button type="button" class="btn btn-outline-primary active" id="mode-chat" onclick="switchMode('chat')">
            <i class="bi bi-chat-text"></i> Chat
          </button>
          <button type="button" class="btn btn-outline-secondary" id="mode-narrator" onclick="switchMode('narrator')">
            <i class="bi bi-mic"></i> Narrator
          </button>
        </div>
        <div class="ms-auto">
          <button type="button" class="btn btn-success" id="btn-check-model" onclick="checkInModel()">
            <i class="bi bi-check-circle"></i> Проверить в модели
          </button>
          <button type="button" class="btn btn-primary" id="btn-save" onclick="saveInstruction()">
            <i class="bi bi-save"></i> Сохранить
          </button>
          <button type="button" class="btn btn-warning" id="btn-preview" onclick="previewPrompt()">
            <i class="bi bi-eye"></i> Предпросмотр промта
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Editor Area -->
  <div class="card mb-3">
    <div class="card-header">
      <div class="d-flex justify-content-between align-items-center">
        <span class="fw-bold">Редактор</span>
        <span class="badge bg-secondary" id="current-version">v1</span>
      </div>
    </div>
    <div class="card-body p-0">
      <textarea id="instruction-editor" class="form-control" rows="15" placeholder="Введите системную инструкцию..." spellcheck="false"></textarea>
    </div>
  </div>

  <!-- Versions Panel -->
  <div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span class="fw-bold"><i class="bi bi-clock-history"></i> История версий</span>
      <button type="button" class="btn btn-sm btn-outline-secondary" onclick="refreshVersions()">
        <i class="bi bi-arrow-clockwise"></i> Обновить
      </button>
    </div>
    <div class="card-body p-0">
      <div id="versions-list" class="list-group list-group-flush">
        <div class="list-group-item text-muted">Загрузка версий...</div>
      </div>
    </div>
  </div>

  <!-- Token Counter -->
  <div class="card">
    <div class="card-header">
      <div class="d-flex justify-content-between align-items-center">
        <span class="fw-bold"><i class="bi bi-calculator"></i> Статистика</span>
      </div>
    </div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-4">
          <div class="p-3 bg-light rounded text-center">
            <div class="h3 mb-0" id="char-count">0</div>
            <div class="small text-muted">Символов</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="p-3 bg-light rounded text-center">
            <div class="h3 mb-0" id="word-count">0</div>
            <div class="small text-muted">Слов</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="p-3 bg-light rounded text-center">
            <div class="h3 mb-0" id="token-estimate">~0</div>
            <div class="small text-muted">Токенов (оценка)</div>
          </div>
        </div>
      </div>
      <div class="mt-3 small text-muted" id="token-preview"></div>
    </div>
  </div>
</div>

<!-- Prompt Preview Modal -->
<div class="modal fade" id="prompt-preview-modal" tabindex="-1" aria-labelledby="prompt-preview-modal-label" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="prompt-preview-modal-label">Предпросмотр промта</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="prompt-preview-content">
        <p>Загрузка...</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initI18n, switchLang, applyTranslations } from '../js/i18n.js';

window.switchLang = switchLang;
window.applyTranslations = applyTranslations;

// ── Helpers ────────────────────────────────────────────────────────────────
function adminFetch(url, options = {}) {
  return window.api
    ? window.api.fetch(url, options)
    : fetch(url, options).then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      });
}

function notify(msg, type = 'info') {
  if (typeof showNotification === 'function') {
    showNotification(msg, type);
  } else {
    console.log(`[${type}] ${msg}`);
  }
}

// ── Mode Management ───────────────────────────────────────────────────────
let currentMode = 'chat';

function switchMode(mode) {
  currentMode = mode;
  document.getElementById('mode-chat').classList.toggle('active', mode === 'chat');
  document.getElementById('mode-narrator').classList.toggle('active', mode === 'narrator');
  loadInstruction();
}

// ── Instructions API ──────────────────────────────────────────────────────
async function loadInstruction() {
  try {
    const data = await adminFetch(`/api/admin/instructions?mode=${currentMode}`);
    const editor = document.getElementById('instruction-editor');
    if (data && data.content) {
      editor.value = data.content;
    } else {
      editor.value = '';
    }
    updateStats();
    notify('Инструкция загружена', 'success');
  } catch (e) {
    notify('Ошибка загрузки инструкции: ' + e.message, 'danger');
    document.getElementById('instruction-editor').value = '';
  }
}

async function saveInstruction() {
  const content = document.getElementById('instruction-editor').value.trim();
  if (!content) {
    notify('Инструкция не может быть пустой', 'warning');
    return;
  }

  try {
    const data = await adminFetch('/api/admin/instructions/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode: currentMode, content })
    });
    notify('Инструкция сохранена', 'success');
    refreshVersions();
  } catch (e) {
    notify('Ошибка сохранения: ' + e.message, 'danger');
  }
}

async function checkInModel() {
  const content = document.getElementById('instruction-editor').value.trim();
  const prompt = "Привет! Подтверди, что ты получил инструкцию и готов к работе. Ответь только: 'Понял, готов к работе!'";

  const btn = document.getElementById('btn-check-model');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Проверка...';

  try {
    const result = await adminFetch('/api/admin/instructions/check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode: currentMode, prompt, instruction: content })
    });

    const statusEl = document.getElementById('token-preview');
    let tokenInfo = '';
    if (result.token_count) {
      tokenInfo = `<br>Использовано токенов: ${result.token_count}`;
    }

    if (result.response) {
      statusEl.innerHTML = `<strong>Ответ модели:</strong><br>${escapeHtml(result.response)}${tokenInfo}`;
      notify('Проверка завершена', 'success');
    } else {
      statusEl.innerHTML = 'Ошибка: нет ответа от модели';
      notify('Ошибка проверки', 'danger');
    }
  } catch (e) {
    document.getElementById('token-preview').innerHTML = `<strong class="text-danger">Ошибка проверки: ${e.message}</strong>`;
    notify('Ошибка проверки: ' + e.message, 'danger');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-check-circle"></i> Проверить в модели';
  }
}

async function refreshVersions() {
  try {
    const data = await adminFetch('/api/admin/instructions/versions');
    const list = document.getElementById('versions-list');
    
    if (!data.versions || !data.versions.length) {
      list.innerHTML = '<div class="list-group-item text-muted">Нет сохраненных версий</div>';
      return;
    }

    list.innerHTML = data.versions.map((v, idx) => `
      <button type="button" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center ${v.is_active ? 'active' : ''}" onclick="useVersion(${v.id}, '${v.role}')">
        <div>
          <strong>${v.role === 'chat' ? '💬 Chat' : '🎙️ Narrator'} v${v.id}</strong>
          <span class="badge bg-secondary ms-2">${new Date(v.created_at).toLocaleString('ru-RU')}</span>
        </div>
        ${v.is_active ? '<span class="badge bg-success">Активная</span>' : ''}
      </button>
    `).join('');
  } catch (e) {
    document.getElementById('versions-list').innerHTML = `<div class="list-group-item text-danger">Ошибка загрузки версий: ${e.message}</div>`;
  }
}

async function useVersion(versionId, role) {
  try {
    await adminFetch('/api/admin/instructions/activate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: versionId })
    });
    
    if (role === currentMode) {
      await loadInstruction();
    }
    await refreshVersions();
    notify(`Версия v${versionId} активирована`, 'success');
  } catch (e) {
    notify('Ошибка активации: ' + e.message, 'danger');
  }
}

async function previewPrompt() {
  const content = document.getElementById('instruction-editor').value.trim();
  const preview = `
    <strong>Контекст системной инструкции:</strong><br>
    ${escapeHtml(content)}<br><br>
    <strong>Ваш запрос:</strong><br>
    "Привет! Подтверди, что ты получил инструкцию и готов к работе."
  `;
  
  const modal = new bootstrap.Modal(document.getElementById('prompt-preview-modal'));
  document.getElementById('prompt-preview-content').innerHTML = preview;
  modal.show();
}

// ── Stats ─────────────────────────────────────────────────────────────────
function updateStats() {
  const content = document.getElementById('instruction-editor').value;
  
  // Characters
  document.getElementById('char-count').textContent = content.length;
  
  // Words
  const words = content.trim().split(/\s+/).filter(w => w.length > 0);
  document.getElementById('word-count').textContent = words.length;
  
  // Token estimate (rough: 1 token ~ 4 chars in English, 1.5 in Russian)
  const estimatedTokens = Math.ceil(content.length / 3);
  document.getElementById('token-estimate').textContent = '~' + estimatedTokens;
  
  return estimatedTokens;
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML.replace(/\n/g, '<br>');
}

// ── Initialization ────────────────────────────────────────────────────────
async function initInstructionsTab() {
  // Initialize i18n
  const savedLang = localStorage.getItem('app_language') || 'ru';
  await initI18n(savedLang);
  
  // Setup language selector
  const langSelector = document.getElementById('lang-selector');
  if (langSelector) {
    langSelector.value = savedLang;
    langSelector.addEventListener('change', (e) => {
      switchLang(e.target.value);
    });
  }
  
  // Load instruction
  await loadInstruction();
  
  // Load versions
  await refreshVersions();
  
  // Stats on input
  document.getElementById('instruction-editor').addEventListener('input', updateStats);
  
  applyTranslations();
}

// Initialize
if (window.initInstructionsTab) {
  window.initInstructionsTab = initInstructionsTab;
} else {
  initInstructionsTab();
}

window.initInstructionsTab = initInstructionsTab;
</script>
